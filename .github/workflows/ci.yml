name: Unit tests and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e '.[test]' build
      - name: Prepare pinned MCU symbol data for host model tests
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from urllib.request import urlopen
          import sexpdata as sx

          # Official KiCad symbols 10.0.7; no native CAD executable is needed.
          commit = 'e1bb0a65cb243525367c5dc7294665b9fd57fc4d'
          expected = {
              'STM32F072C_8-B_Tx': '2224097bab12bfddc34e52c5d2c62a2d1b11040040879f19fd3810e5b953d797',
              'STM32F072CBTx': 'a2ab6b9dba2563834b36329815ed36906d36ab0f55cb0e0cc66d98efbc422605',
          }
          symbols = []
          for name, sha in expected.items():
              url = f'https://gitlab.com/kicad/libraries/kicad-symbols/-/raw/{commit}/MCU_ST_STM32F0.kicad_symdir/{name}.kicad_sym'
              with urlopen(url, timeout=60) as response:
                  data = response.read()
              assert hashlib.sha256(data).hexdigest() == sha, 'Unexpected official symbol data'
              symbols.extend(item for item in sx.loads(data.decode())
                             if isinstance(item, list) and item and str(item[0]) == 'symbol')
          support = Path(os.environ['RUNNER_TEMP']) / 'kicad-host-symbols'
          (support / 'symbols').mkdir(parents=True)
          tree = [sx.Symbol('kicad_symbol_lib'), [sx.Symbol('version'), 20251024], *symbols]
          (support / 'symbols/MCU_ST_STM32F0.kicad_sym').write_text(sx.dumps(tree))
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'SMILEPCB_KICAD_SUPPORT={support}\n')
          PY
      - name: Run tests without native CAD dependencies
        run: python -m pytest -q tests
      - name: Check installed entry points
        run: |
          smilepcb --help
          smilepcb-mcp --help
          python -m pip check
      - name: Build distributions
        run: python -m build
      - name: Inspect built resources, notices and source archive privacy
        env:
          SMILEPCB_DIST_DIR: ${{ github.workspace }}/dist
        run: python -m pytest -q tests/test_installed_stm32_distribution.py
      - name: Test installed wheel outside the source checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smilepcb-installed"
          for archive in "$GITHUB_WORKSPACE"/dist/*.whl; do
            "$RUNNER_TEMP/smilepcb-installed/bin/python" -m pip install "$archive[test]"
          done
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smilepcb-installed/bin/python" -c "import pathlib,smilepcb; assert pathlib.Path(smilepcb.__file__).resolve().is_relative_to(pathlib.Path('$RUNNER_TEMP/smilepcb-installed'))"
          "$RUNNER_TEMP/smilepcb-installed/bin/python" -m smilepcb.cli build --help
          "$RUNNER_TEMP/smilepcb-installed/bin/python" -m pip check
          "$RUNNER_TEMP/smilepcb-installed/bin/python" -m pytest -q "$GITHUB_WORKSPACE/tests/test_installed_stm32_pipeline.py" -k 'installed_pipeline_reaches or incomplete_finished_stage or normal_cli'
          "$RUNNER_TEMP/smilepcb-installed/bin/python" -m pytest -q "$GITHUB_WORKSPACE/tests/test_installed_stm32_mcp.py" -k 'generation_dispatch_uses or generation_tool_is_advertised'
          "$RUNNER_TEMP/smilepcb-installed/bin/python" -c "import os,pathlib,smilepcb,pytest,sys; os.environ['SMILEPCB_INSTALLED_TEST_ROOT']=str(pathlib.Path(smilepcb.__file__).resolve().parents[1]); raise SystemExit(pytest.main(['-q','-p','no:cacheprovider',sys.argv[1]]))" "$GITHUB_WORKSPACE/tests/test_installed_stm32_worker_provenance.py"
